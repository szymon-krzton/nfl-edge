<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Edge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--card:#121922;--card2:#18212c;--ln:#223040;--tx:#e6edf3;--mu:#8b98a9;--ac:#3ddc97;--warn:#f5a524;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 70% -10%,#122235 0,transparent 60%),var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:1600px;margin:0 auto;padding:20px 24px 48px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.02em;margin:0}
h1{font-size:36px}h2{font-size:21px}h3{font-size:17px;margin:12px 0 6px}
.mu{color:var(--mu)}button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-top:14px}
.card>h2{margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.card>h2 small{font:400 13px Inter,sans-serif;color:var(--mu)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.chip,.tab{padding:6px 12px;border:1px solid var(--ln);background:var(--card2);border-radius:999px}
.tab{border-radius:8px}.chip:hover,.tab:hover{border-color:var(--ac)}
.chip[aria-pressed=true],.tab[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#04130c;font-weight:600}
.back{border:0;background:none;color:var(--mu);padding:0;margin-bottom:10px}.back:hover{color:var(--tx)}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}tr:last-child td{border-bottom:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.badge{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;font-weight:700;margin-left:6px;background:#3a1f22;color:var(--bad)}.badge.w{background:#3a2b10;color:var(--warn)}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}.stat b{display:block;font:700 24px "Barlow Condensed",sans-serif}
.bar{display:inline-block;height:6px;background:var(--ln);border-radius:3px;width:80px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
input{background:var(--card2);border:1px solid var(--ln);border-radius:8px;color:var(--tx);padding:6px 9px;font:inherit;width:90px}
.link{border:0;background:none;padding:0;text-decoration:underline;text-decoration-color:var(--ln);text-underline-offset:3px;text-align:left}.link:hover{color:var(--ac)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start;margin-top:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}.cols .card{margin-top:0}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}.col{display:contents}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:10px}
.tile{border:1px solid transparent;border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;line-height:1.25;background:var(--card2)}
.tile small{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu)}
.tile b{display:block;font:700 22px "Barlow Condensed",sans-serif}
.tile:hover{border-color:var(--mu)}.tile[aria-pressed=true]{border-color:var(--tx)}
.tile.empty{border:1px dashed var(--ln);background:none;color:var(--mu)}
.nin{width:42px;padding:0 2px;margin:0 2px;font-size:12px;text-align:center;background:var(--card);border-radius:4px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
