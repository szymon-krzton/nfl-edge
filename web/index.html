<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Edge</title>
<style>
:root{--bg:#f3f5f2;--ink:#17201a;--mu:#5f6b62;--ln:#d5dbd3;--tu:#1f6b3a;--hi:#e6f0e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:980px;margin:0 auto;padding:20px 16px}h1{font-size:24px;margin:0 0 16px}h2{font-size:16px;margin:22px 0 8px}
input,select{padding:8px;border:1px solid var(--ln);border-radius:4px;background:#fff;font:inherit;margin:0 8px 8px 0}
.t{overflow-x:auto}table{border-collapse:collapse;width:100%;background:#fff}th,td{padding:6px 10px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;background:var(--hi)}tr.avg td{font-weight:700;background:var(--hi)}
.mu{color:var(--mu)}button{padding:6px 10px;border:1px solid var(--ln);background:#fff;border-radius:4px;cursor:pointer;font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--tu);outline-offset:1px}
</style></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
