name: refresh-odds
on:
  schedule:
    - cron: "0 9,17 * * *"     # codziennie rano i wieczorem (UTC)
    - cron: "30 14-21 * * 0"   # niedziela: dodatkowo co godzinę przed i w trakcie meczów
  workflow_dispatch:
concurrency:
  group: refresh-odds
  cancel-in-progress: false
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python ingest/odds_data.py
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDS_MAX_CALLS: "6"   # twardy limit zapytań na uruchomienie (oszczędza miesięczne 250)
      - run: |
          git config user.name "data-bot" && git config user.email "bot@users.noreply.github.com"
          git add web/public/data/odds.json web/public/data/odds_history.json web/public/data/value.json ingest/odds_players.json ingest/odds_catalog.json
          if git diff --cached --quiet; then echo "bez zmian"; exit 0; fi
          git commit -m "odświeżenie kursów"
          git pull --rebase
          git push